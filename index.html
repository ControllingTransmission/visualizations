  <body>

    <div id="support-dialog">
      <div id='no-gamepad-support'>
      Your browser does not seem to support Gamepad API, or it might be
      we’re not detecting it very well. Sorry!
      </div>
      <div id='no-gamepads-connected'>
      No gamepads seem to be connected. Be sure to plug in a gamepad and then
      press any of its buttons to activate it.
      </div>
    </div>
    
    <div id="debug">
      
    </div>
    
    <div id="menu">
      <ul>
        <li><span class="selected">grids</span></li>
        <li><span>bars</span></li>
        <li><span>robots</span></li>
        <li><span>galaxies</span></li>
        <li><span>shapes</span></li>
      </ul>
    </div>
    
		<video id="video" autoplay loop style="display:none">
			<source src="visuals/doctorpopular/defenestration.mp4" type='video/mp4; codecs="avc1.42E01E, mp4a.40.2"'>
		</video>
    
    
    <script>
      if(window!==top){
        document.body.classList.add('iframe');
      }
      
      // Initialize with error handling
      try {
        var gamepad = new Gamepad();
        $(document).ready(function(){
          try {
            if (!gamepad.init()) {
              console.warn('Gamepad support not available - using keyboard controls only');
            }
            
            game = null;
            
            // Check if menu object exists before initializing
            if (typeof menu !== 'undefined' && menu.init) {
              menu.init();
            } else {
              console.error('Menu system not available');
            }
          } catch (e) {
            console.error('Error during initialization:', e);
            // Show a user-friendly message
            document.body.innerHTML = '<div style="color: white; text-align: center; margin-top: 50px;">' +
              '<h1>Demo Loading Error</h1>' +
              '<p>There was an error loading the demo. Please check the browser console for details.</p>' +
              '<p>Try refreshing the page or using a different browser.</p>' +
              '</div>';
          }
        });
      } catch (e) {
        console.error('Critical error during setup:', e);
      }
    </script>
  </body>
